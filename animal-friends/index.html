<!doctype html>
<html lang="en" data-content-manifest="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8ad7e9">
  <meta name="description" content="Match friendly animal pictures with their English names in a Grade 1 memory game.">
  <title>Animal Friends · Dream Brainmatch</title>
  <base href="../shape-friends/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css?v=4">
  <link rel="stylesheet" href="prototype.css?v=12">
  <link rel="stylesheet" href="../animal-friends/animal-friends.css?v=1">
</head>
<body>
  <p class="variant-loading" role="status">Calling the animal friends…</p>
  <script type="module">
    const manifestURL=new URL('game-content.json',window.location.href).href;
    const source=await fetch('../shape-friends/index.html').then(response=>response.text());
    const template=new DOMParser().parseFromString(source,'text/html');
    template.body.querySelectorAll('script').forEach(script=>script.remove());
    document.body.replaceChildren(...template.body.childNodes);
    document.documentElement.dataset.contentManifest=manifestURL;
    const gameScript=document.createElement('script');
    gameScript.type='module';
    gameScript.src=new URL('../shape-friends/app.js?v=14',window.location.href).href;
    gameScript.addEventListener('error',()=>{
      const message=document.createElement('p');
      message.className='variant-error';
      message.textContent='Animal Friends could not start. Please reload the page.';
      document.body.append(message);
    });
    document.body.append(gameScript);
  </script>
</body>
</html>
